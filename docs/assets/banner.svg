<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="template-native-gpu">
  <rect width="1200" height="120" rx="10" fill="#0b1020"/>
  <rect x="1" y="1" width="1198" height="118" rx="9" fill="none" stroke="#111a35" stroke-width="2"/>

  <!-- Left accent bar -->
  <rect x="28" y="24" width="6" height="24" rx="3" fill="#06b6d4"/>
  <rect x="28" y="52" width="6" height="20" rx="3" fill="#3b82f6"/>
  <rect x="28" y="76" width="6" height="20" rx="3" fill="#8b5cf6"/>

  <!-- Wordmark and two short muted lines -->
  <text x="52" y="54" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="32" font-weight="700" letter-spacing="-0.5">template-native-gpu</text>
  <text x="52" y="80" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Native C/C++ core · Multi-backend GPU dispatch · FFmpeg Vulkan filter patch stack</text>
  <text x="52" y="100" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">CUDA · HIP · Metal · SYCL · Vulkan · Append-only side-data ABI</text>

  <!-- Right decorative GPU dispatch node motif -->
  <g transform="translate(940, 22)">
    <rect x="0" y="0" width="232" height="76" rx="8" fill="#111a35" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="6" fill="#06b6d4"/>
    <circle cx="24" cy="52" r="6" fill="#8b5cf6"/>
    <line x1="30" y1="24" x2="88" y2="24" stroke="#06b6d4" stroke-width="2"/>
    <line x1="30" y1="52" x2="88" y2="52" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="88" y="12" width="56" height="24" rx="4" fill="#0b1020" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="116" y="28" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">ABI</text>
    <rect x="88" y="40" width="56" height="24" rx="4" fill="#0b1020" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="116" y="56" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">GPU</text>
    <line x1="144" y1="24" x2="168" y2="38" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="144" y1="52" x2="168" y2="38" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="168" y="26" width="48" height="24" rx="4" fill="#06b6d4"/>
    <text x="192" y="42" fill="#0b1020" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">VRAM</text>
