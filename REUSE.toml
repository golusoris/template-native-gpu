# SPDX-FileCopyrightText: 2026 The PROJECT Authors
# SPDX-License-Identifier: EUPL-1.2
#
# Copyright and licence of every file in the repository. REUSE 3.3 applies only
# the last table whose path matches a file, so the whole-tree default comes
# first and every narrower table follows it.

version = 1

# Code, configuration, tooling and deploy manifests are EUPL-1.2. "closest"
# lets a file's own SPDX header win where it has one.
[[annotations]]
path = ["*", ".*", "*/**", ".*/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The PROJECT Authors"
SPDX-License-Identifier = "EUPL-1.2"

# Documentation text, agent context and changelogs.
[[annotations]]
path = [
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "GOVERNANCE.md",
  "MAINTAINERS.md",
  "SUPPORT.md",
  "CHANGELOG.md",
  "AGENTS.md",
  "CLAUDE.md",
  "**/AGENTS.md",
  "**/README.md",
  "docs/**",
  "changelog.d/**",
  ".claude/agents/*.md",
  ".claude/skills/*/SKILL.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The PROJECT Authors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Contributor Covenant 2.1, adopted unchanged.
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

# Filter sources under files/ are built into FFmpeg and the patches carry
# FFmpeg's context lines, so both keep FFmpeg's licence, and FFmpeg's
# copyright applies next to the patch author's. generate.sh, series.txt and
# test/ are tooling and stay under the default table.
[[annotations]]
path = ["ffmpeg-patches/files/**", "ffmpeg-patches/*.patch"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2026 The PROJECT Authors"]
SPDX-License-Identifier = "LGPL-2.1-or-later"
