# Supply-chain provenance: build provenance attestation, Sigstore keyless
# signing, SBOM. Triggered when release-please publishes a tag.
#
# The attestation is a GitHub artifact attestation, which GitHub documents as
# SLSA v1.0 Build Level 2. Level 3 needs the build in a reusable workflow that
# is isolated from its caller; this workflow does not claim it.
#
# TEMPLATE: action SHAs are pinned (Scorecard and the repository's commit-pin
# setting require it). Renovate's `helpers:pinGitHubActionDigests` keeps them
# current — bump via PR, don't unpin.

name: supply-chain
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build provenance for"
        required: true

# Least-privilege at the workflow level; jobs opt into write scopes per-job.
permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config glslang-tools
      - name: Build (release)
        run: |
          meson setup --werror build --buildtype=release
          meson compile -C build
      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          for f in build/libproject/libproject.so*; do [ -d "$f" ] || cp "$f" artifacts/; done
          ls artifacts/libproject.so.*
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 7

  sbom:
    name: Generate SBOM (SPDX + CycloneDX)
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          path: .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*.json

  sign:
    name: Sigstore keyless sign (cosign)
    needs: build-artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore keyless OIDC
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-artifacts, path: artifacts/ }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "v3.0.6" }
      - name: Sign every artifact (keyless OIDC)
        run: |
          cd artifacts
          for f in *; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: artifacts/*.bundle
