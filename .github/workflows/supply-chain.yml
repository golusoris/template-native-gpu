# Supply-chain provenance: SLSA L3 build, Sigstore keyless signing, SBOM.
# Triggered when release-please publishes a tag.
#
# TEMPLATE: action SHAs are pinned (Scorecard / SLSA require it). Renovate's
# `helpers:pinGitHubActionDigests` keeps them current — bump via PR, don't
# unpin. The reusable SLSA workflow is the one exception (it must use a vX.Y.Z
# tag ref); audit its bumps in a dedicated PR.

name: supply-chain
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build provenance for"
        required: true

# Least-privilege at the workflow level; jobs opt into write scopes per-job.
permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config glslang-tools
      - name: Build (release)
        run: |
          meson setup build --buildtype=release
          meson compile -C build
      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp build/libproject/libproject.so* artifacts/ 2>/dev/null || true
      - name: Compute SHA256 hashes (SLSA input)
        id: hash
        run: |
          cd artifacts
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/
          retention-days: 7

  sbom:
    name: Generate SBOM (SPDX + CycloneDX)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          path: .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*.json

  sign:
    name: Sigstore keyless sign (cosign)
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore keyless OIDC
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: release-artifacts, path: artifacts/ }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "v3.0.6" }
      - name: Sign every artifact (keyless OIDC)
        run: |
          cd artifacts
          for f in *; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: artifacts/*.bundle

  slsa-provenance:
    name: SLSA L3 provenance
    needs: build-artifacts
    permissions:
      id-token: write
      contents: write
      actions: read
    # Reusable-workflow refs cannot be SHA-pinned in all consumers; the SLSA
    # maintainers recommend the vX.Y.Z tag form. Audit bumps in a dedicated PR.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-artifacts.outputs.hashes }}
      upload-assets: ${{ github.event_name == 'release' }}
