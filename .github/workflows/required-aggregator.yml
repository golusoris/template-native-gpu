# Single required status check for branch protection. Instead of marking every
# matrix leg "required" (which breaks when a leg is renamed), protect main on
# THIS one job. It waits for the upstream jobs and fails if any did not succeed.
#
# Branch protection: require the "required-checks" status only.

name: required-aggregator
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for upstream workflows
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: required-checks
          # Wait for every check except this aggregator itself.
          allowed-conclusions: success,skipped
          wait-interval: 20
      - name: All required checks passed
        run: echo "ok"
