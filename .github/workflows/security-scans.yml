# Static + supply-chain security scans: CodeQL (C/C++), semgrep, gitleaks,
# trivy filesystem, and cargo-deny (only if a Cargo.toml exists). All findings
# upload to the code-scanning dashboard where supported.

name: security-scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (C/C++)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config glslang-tools
      - uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          languages: c-cpp
          config-file: ./.github/codeql-config.yml
      - name: Build for CodeQL
        run: |
          meson setup --werror build
          meson compile -C build
      - uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6

  semgrep:
    name: semgrep
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Semgrep scan refuses a planted finding
        run: bash scripts/ci/security-scans_test.sh semgrep
      - name: Run semgrep (project rules + c + cwe-top-25)
        run: bash scripts/ci/semgrep-scan.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { fetch-depth: 0 }
      # The gitleaks-action wrapper needs a paid licence key for organisation
      # repositories; the binary is MIT.
      - name: Installer refuses a wrong digest
        run: bash scripts/ci/security-scans_test.sh gitleaks-install
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: gitleaks refuses a planted key
        run: bash scripts/ci/security-scans_test.sh gitleaks-scan
      - name: gitleaks
        run: |
          set -euo pipefail
          . tools/tool-versions.env
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
          gitleaks git . -c .gitleaks.toml --redact --no-banner --verbose

  trivy:
    name: trivy filesystem
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The wrapper action calls an inner action by tag, which this repository's
      # SHA-pinning policy refuses.
      - name: trivy filesystem scan (SARIF)
        run: bash scripts/ci/trivy-scan.sh trivy.sarif
      - uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with: { sarif_file: trivy.sarif }

  cargo-deny:
    name: cargo-deny (if Rust present)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo-deny
        run: |
          if ls -- Cargo.toml */Cargo.toml >/dev/null 2>&1; then
            cargo install cargo-deny --locked
            cargo deny check
          else
            echo "no Cargo.toml — skipping cargo-deny"
          fi
