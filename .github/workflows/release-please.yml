# release-please: open/maintain a release PR from Conventional Commits, and cut
# a tag + GitHub release when that PR merges. The published `release` event then
# triggers supply-chain.yml (build provenance + cosign + SBOM).

name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags + releases
      pull-requests: write # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
