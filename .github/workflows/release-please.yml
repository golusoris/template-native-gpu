# release-please: open/maintain a release PR from Conventional Commits, and cut
# a tag + GitHub release when that PR merges. The published `release` event then
# triggers supply-chain.yml (build provenance + cosign + SBOM).

name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # create tags + releases
      pull-requests: write # maintain the release PR
    steps:
      # Tags, releases and the release pull request made with the workflow token start no workflow; the App token's do.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
