# Sanitizer + fuzz gate. Builds the test suite under ASan/UBSan (and TSan in a
# separate job), and runs the libFuzzer targets for a short smoke duration.

name: sanitizers
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-meson-deps
      - name: Build + test (address,undefined)
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup --werror build -Db_sanitize=address,undefined -Db_lundef=false
          meson compile -C build
          meson test -C build --print-errorlogs

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-meson-deps
      - name: Build + test (thread)
        env: { CC: clang, CXX: clang++ }
        run: |
          meson setup --werror build examples/full-gpu-matrix/core -Db_sanitize=thread -Db_lundef=false
          meson compile -C build
          meson test -C build --print-errorlogs

  fuzz-smoke:
    name: libFuzzer smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/install-meson-deps
      - name: Build fuzz targets
        env: { CC: clang, CXX: clang++ }
        run: |
          meson setup --werror build examples/full-gpu-matrix/core
          meson compile -C build
      - name: Run fuzz target (60s smoke)
        run: |
          BIN=$(find build -name 'fuzz_dispatch_parse' -type f | head -1)
          if [ -n "$BIN" ]; then "$BIN" -max_total_time=60 -runs=200000; \
          else echo "no fuzz binary (needs clang -fsanitize=fuzzer) — skipping"; fi
