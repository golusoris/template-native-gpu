name: "PROJECT CodeQL config"

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

# Suppress query rules that conflict with the project's coding standard.
# cpp/poorly-documented-function flags every function lacking a Doxygen block;
# the project's style is "one-liner WHY comments only, no boilerplate doc
# comments" (docs/principles.md), so this rule is over-zealous against our
# documented style rather than flagging real correctness issues.
query-filters:
  - exclude:
      id: cpp/poorly-documented-function

paths:
  - libproject
  - examples
  - ffmpeg-patches/files
paths-ignore:
  - subprojects
  - build
