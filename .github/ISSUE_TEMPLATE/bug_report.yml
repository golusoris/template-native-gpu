name: Bug report
description: Report a defect in PROJECT
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Please do NOT report security issues here — see
        SECURITY.md for the private disclosure flow.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `proj_version_string()` or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [CPU, CUDA, HIP, Metal, SYCL, Vulkan, "N/A"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproducer
      description: Minimal inputs + command line; expected vs actual.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU + driver, toolchain (meson/ninja/compiler versions).
    validations:
      required: true
